[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 10_000
via_ir = false
gas_reports = ["SettlementEngine", "NettingEngine", "AssetRegistry"]

[profile.default.fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[profile.ci]
verbosity = 3
fuzz = {runs = 2048}
